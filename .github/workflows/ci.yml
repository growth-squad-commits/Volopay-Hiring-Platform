name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RATE_LIMIT_PEPPER: ci-rate-limit-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:phase1
      - run: npm run test:phase2
      - run: npm run lint
      - name: Run TypeScript and capture report
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty false > tsc-report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-report
          path: tsc-report.txt
      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run build