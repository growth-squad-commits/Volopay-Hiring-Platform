name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RATE_LIMIT_PEPPER: ci-rate-limit-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:phase1
      - run: npm run test:phase2
      - name: Run ESLint and capture report
        id: lint
        continue-on-error: true
        run: npx eslint . --format json --output-file eslint-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npx tsc --noEmit
      - run: npm run build